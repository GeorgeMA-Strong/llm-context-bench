[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-context-bench"
version = "0.3.0"
description = "Reproducible 16K-128K quality and performance benchmarks for OpenAI-compatible LLM servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "llm-context-bench contributors"}]
keywords = ["llama.cpp", "vllm", "sglang", "llm", "benchmark", "long-context", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# Build-time dependency for tools/generate_fixtures.py (fixture rebuild/verify).
fixtures = ["tokenizers>=0.21"]

[project.scripts]
llm-context-bench = "llm_context_bench.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_context_bench = ["prompts/*.txt", "suites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
